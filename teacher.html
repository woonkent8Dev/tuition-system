<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师端 - 升级重构版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 p-4 md:p-6 text-sm">
    <div class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow-sm space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 gap-4">
            <h1 class="text-xl font-bold text-gray-800">🎒 课室管理后台</h1>
            <div class="flex gap-2">
                <button onclick="toggleStatsSlide()" class="bg-slate-700 text-white px-3 py-1.5 rounded text-xs">📊 数据看板</button>
                <button onclick="toggleScanner()" class="bg-purple-600 text-white px-3 py-1.5 rounded text-xs">📷 扫码打卡</button>
            </div>
        </div>

        <div id="statsSlide" class="hidden bg-slate-900 p-4 rounded-xl text-white grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
            <div class="p-2 border border-slate-700 rounded">进步：<span id="statProgress" class="text-green-400 font-bold">-</span></div>
            <div class="p-2 border border-slate-700 rounded">退步：<span id="statRegress" class="text-red-400 font-bold">-</span></div>
            <div class="p-2 border border-slate-700 rounded">待换学费券：<span id="statCoupons" class="text-amber-400 font-bold">-</span></div>
            <div class="p-2 border border-slate-700 rounded">待领饮料：<span id="statDrinks" class="text-blue-400 font-bold">-</span></div>
        </div>

        <div id="scannerContainer" class="hidden max-w-md mx-auto"><div id="reader"></div></div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse border-t">
                <thead><tr class="bg-gray-50 text-gray-600 text-xs uppercase font-bold"><th class="p-3">学号/姓名</th><th class="p-3">课时/余额</th><th class="p-3 text-center">学术设定</th><th class="p-3 text-center">奖励核销</th><th class="p-3 text-right">操作</th></tr></thead>
                <tbody id="studentTable" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>
    </div>

    <div id="scoreModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl w-full max-w-sm p-6 space-y-4">
            <h3 class="font-bold border-b pb-2">🎯 成绩与饮料目标设定</h3>
            <div class="space-y-3">
                <p class="text-xs text-gray-500">学生：<span id="modalName" class="font-bold text-gray-800"></span></p>
                <input type="number" id="modalLast" placeholder="上期分数" class="w-full p-2 border rounded">
                <input type="number" id="modalCurr" placeholder="本期分数" class="w-full p-2 border rounded">
                <div class="bg-blue-50 p-3 rounded border border-blue-100">
                    <label class="block text-blue-700 text-xs font-bold mb-1">🥤 定制饮料目标分 (达成即发券)</label>
                    <input type="number" id="modalTarget" placeholder="如：60" class="w-full p-2 border-blue-200 border rounded font-bold text-blue-700">
                </div>
            </div>
            <div class="flex justify-end gap-2"><button onclick="closeModal('scoreModal')" class="px-4 py-2 text-xs">取消</button><button onclick="submitScores()" class="px-4 py-2 bg-purple-600 text-white rounded text-xs font-bold">保存并更新</button></div>
        </div>
    </div>

    <div id="rewardModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl w-full max-w-sm p-6 space-y-4">
            <h3 class="font-bold border-b pb-2">🎁 礼券核销中心</h3>
            <div id="rewardShelf" class="space-y-3 min-h-[100px]"></div>
            <div class="text-right border-t pt-2"><button onclick="closeModal('rewardModal')" class="text-xs text-gray-500">关闭</button></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxaEKXEi0knlmfW63URckZlUBCfvqAYhYOkr469z6a1OPxMB9fpwpvM9OnvzlIRv1xQ/exec"; 
        let studentsData = [];
        let curRow = null;

        async function loadStudents() {
            const res = await fetch(API_URL);
            studentsData = await res.json();
            calculateStats();
            renderTable();
        }

        function calculateStats() {
            let prog = 0, reg = 0, coup = 0, drink = 0;
            studentsData.forEach(s => {
                if(parseInt(s.CurrentScore) > parseInt(s.LastScore)) prog++;
                if(parseInt(s.CurrentScore) < parseInt(s.LastScore)) reg++;
                if(String(s.RewardStatus).includes("未兑换")) coup++;
                if(s.CustomRewardStatus === "饮料未兑换") drink++;
            });
            document.getElementById("statProgress").innerText = prog;
            document.getElementById("statRegress").innerText = reg;
            document.getElementById("statCoupons").innerText = coup;
            document.getElementById("statDrinks").innerText = drink;
        }

        function renderTable() {
            const tbody = document.getElementById("studentTable");
            tbody.innerHTML = "";
            studentsData.forEach(s => {
                const tr = document.createElement("tr");
                const hasPrize = String(s.RewardStatus).includes("未兑换") || s.CustomRewardStatus === "饮料未兑换";
                tr.innerHTML = `
                    <td class="p-3"><b>${s.Name}</b><br><small class="text-gray-400">#${s.ID}</small></td>
                    <td class="p-3"><b>${s.RemainingLessons} 堂</b><br><small class="text-gray-400">RM ${(s.RemainingLessons * s.PricePerLesson).toFixed(2)}</small></td>
                    <td class="p-3 text-center"><button onclick="openScore(${s.rowNumber},'${s.Name}',${s.LastScore},${s.CurrentScore},${s.CustomTargetScore})" class="bg-purple-50 text-purple-700 px-3 py-1.5 rounded-lg border text-xs">🎯 设定成绩</button></td>
                    <td class="p-3 text-center">
                        <button onclick="openReward(${s.rowNumber})" class="bg-amber-50 text-amber-700 px-3 py-1.5 rounded-lg border text-xs font-bold relative">
                            🎁 礼券核销 ${hasPrize ? '<span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>' : ''}
                        </button>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="adjust(${s.rowNumber},1)" class="bg-gray-100 px-2 py-1 rounded text-xs">+1</button>
                        <button onclick="adjust(${s.rowNumber},4)" class="bg-green-600 text-white px-2 py-1 rounded text-xs ml-1">+4</button>
                        <button onclick="deleteS(${s.rowNumber},'${s.Name}')" class="ml-2 text-red-400">❌</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openScore(row, name, last, curr, target) {
            curRow = row; document.getElementById("modalName").innerText = name;
            document.getElementById("modalLast").value = last; document.getElementById("modalCurr").value = curr;
            document.getElementById("modalTarget").value = target;
            document.getElementById("scoreModal").classList.remove("hidden");
        }
        async function submitScores() {
            const l = document.getElementById("modalLast").value; const c = document.getElementById("modalCurr").value; const t = document.getElementById("modalTarget").value;
            closeModal('scoreModal');
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateScores", rowNumber: curRow, lastScore: l, currentScore: c, customTarget: t }) });
            loadStudents();
        }

        function openReward(row) {
            curRow = row; const s = studentsData.find(x => x.rowNumber === row);
            const shelf = document.getElementById("rewardShelf"); shelf.innerHTML = "";
            // 学费券
            if(String(s.RewardStatus).includes("未兑换")) {
                const txt = s.RewardStatus.replace("未兑换","");
                shelf.innerHTML += `<div class="bg-amber-50 p-3 rounded flex justify-between items-center"><div><b class="text-amber-800 text-xs">学费减免券 ${txt}</b></div><button onclick="claimR(${row})" class="bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold">核销</button></div>`;
            }
            // 饮料券 - 关键修正处
            if(s.CustomRewardStatus === "饮料未兑换") {
                shelf.innerHTML += `<div class="bg-blue-50 p-3 rounded flex justify-between items-center"><div><b class="text-blue-800 text-xs">饮料特调奖</b><br><small class="text-blue-500">目标分 ${s.CustomTargetScore} 已达标</small></div><button onclick="claimD(${row})" class="bg-blue-500 text-white px-3 py-1 rounded text-xs font-bold">确认领取</button></div>`;
            }
            if(!shelf.innerHTML) shelf.innerHTML = `<p class="text-center text-gray-400 py-4 text-xs">暂无待领奖项 蓄力中...</p>`;
            document.getElementById("rewardModal").classList.remove("hidden");
        }

        async function claimR(row) { closeModal('rewardModal'); await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "claimReward", rowNumber: row }) }); loadStudents(); }
        async function claimD(row) { closeModal('rewardModal'); await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "claimDrink", rowNumber: row }) }); loadStudents(); }
        
        function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
        function toggleStatsSlide() { document.getElementById("statsSlide").classList.toggle("hidden"); }
        async function adjust(row, amt) { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "adjustLessons", rowNumber: row, amount: amt }) }); loadStudents(); }
        async function deleteS(row, name) { if(confirm(`确认删除 ${name}?`)) { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "deleteStudent", rowNumber: row }) }); loadStudents(); } }
        
        function toggleScanner() {
            const container = document.getElementById("scannerContainer");
            if (container.classList.contains("hidden")) {
                container.classList.remove("hidden");
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                html5QrcodeScanner.render(onScanSuccess);
            } else { container.classList.add("hidden"); if(html5QrcodeScanner) html5QrcodeScanner.clear(); }
        }
        async function onScanSuccess(txt) {
            if(html5QrcodeScanner) html5QrcodeScanner.clear();
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateAttendance", studentId: txt, date: new Date().toISOString().split('T')[0] }) });
            const data = await res.json();
            alert(`叮！打卡成功：${data.name}`); loadStudents();
            document.getElementById("scannerContainer").classList.add("hidden");
        }
        window.onload = loadStudents;
    </script>
</body>
</html>

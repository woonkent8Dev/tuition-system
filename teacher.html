<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课室管理系统 - 教师端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-sm">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-sm space-y-6">
        
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-xl font-bold text-gray-800">🎒 课室管理系统 (极简直观版)</h1>
            <button onclick="toggleScanner()" class="bg-purple-600 text-white px-4 py-2 rounded shadow font-bold text-xs">📷 扫码打卡</button>
        </div>

        <div id="scannerContainer" class="hidden bg-gray-50 p-4 rounded border-2 border-dashed border-purple-300 max-w-sm mx-auto text-center">
            <div id="reader" class="w-full bg-white rounded overflow-hidden"></div>
            <button onclick="toggleScanner()" class="mt-2 text-xs text-gray-500 hover:underline">关闭扫描枪</button>
        </div>

        <form id="addStudentForm" onsubmit="addStudent(event)" class="bg-blue-50 p-4 rounded-lg flex flex-wrap gap-2 items-center border border-blue-100">
            <span class="font-bold text-blue-800 mr-2">➕ 新增学生:</span>
            <input type="text" id="newName" placeholder="姓名" required class="px-3 py-1.5 border rounded text-xs w-24">
            <input type="text" id="newPhone" placeholder="手机号" required class="px-3 py-1.5 border rounded text-xs w-32">
            <input type="number" id="newPrice" placeholder="单价(RM)" value="37.5" step="0.1" required class="px-3 py-1.5 border rounded text-xs w-24">
            <button type="submit" class="bg-blue-600 text-white px-4 py-1.5 rounded font-bold text-xs">保存</button>
        </form>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-xs uppercase tracking-wider">
                        <th class="p-3">序号 / 姓名</th>
                        <th class="p-3">手机号</th>
                        <th class="p-3">课堂情况 (余堂/充值)</th>
                        <th class="p-3">学术记录 (当期/前期/饮料)</th>
                        <th class="p-3">手动打卡</th>
                        <th class="p-3 text-right">操作</th>
                    </tr>
                </thead>
                <tbody id="studentTable" class="divide-y divide-gray-200 text-sm">
                    <tr><td colspan="6" class="p-4 text-center text-gray-500">正在读取数据...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 🔴 填入你的 Google Apps Script 网址
        const API_URL = "https://script.google.com/macros/s/AKfycbzi0hdl6PBRs7XRzDC8C2OHMb88VfyscbbVdSHrAXujgEsWzk-CCzkUoonPMIENQwYD/exec"; 
        let studentsData = [];
        let html5QrcodeScanner = null;

        async function loadStudents() {
            try {
                const res = await fetch(API_URL);
                studentsData = await res.json();
                renderTable();
            } catch (error) { alert("数据读取失败，请检查网络或后台是否发布为新版本。"); }
        }

        function renderTable() {
            const tbody = document.getElementById("studentTable");
            tbody.innerHTML = "";
            studentsData.forEach(s => {
                const isDebt = s.RemainingLessons <= 0;
                const tr = document.createElement("tr");
                tr.className = isDebt ? "bg-red-50/50" : "hover:bg-gray-50";
                
                // 学术记录显示逻辑
                let academicText = `上期: ${s.LastScore||0} | 本期: <b class="text-blue-600">${s.CurrentScore||0}</b>`;
                if(s.CustomTargetScore > 0) academicText += `<br><span class="text-xs text-orange-600">目标: ${s.CustomTargetScore} (状态: ${s.CustomRewardStatus})</span>`;

                tr.innerHTML = `
                    <td class="p-3"><span class="text-gray-400 text-xs">#${s.ID}</span> <b class="text-gray-800 ml-1">${s.Name}</b></td>
                    <td class="p-3 text-gray-600">${s.Phone}</td>
                    
                    <td class="p-3">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg ${isDebt?'text-red-600':'text-green-600'}">${s.RemainingLessons}堂</span>
                            <div class="flex flex-col gap-1 ml-2">
                                <div class="flex gap-1">
                                    <button onclick="adjust(${s.rowNumber}, 1)" class="bg-gray-200 px-2 py-0.5 rounded text-xs font-bold">+1</button>
                                    <button onclick="adjust(${s.rowNumber}, 4)" class="bg-green-600 text-white px-2 py-0.5 rounded text-xs font-bold">+4堂</button>
                                </div>
                                <button onclick="adjust(${s.rowNumber}, -1)" class="bg-gray-200 px-2 py-0.5 rounded text-xs font-bold w-fit">-1</button>
                            </div>
                        </div>
                    </td>

                    <td class="p-3 text-sm">
                        <div class="mb-1">${academicText}</div>
                        <button onclick="editScores(${s.rowNumber}, '${s.Name}', ${s.LastScore||0}, ${s.CurrentScore||0}, ${s.CustomTargetScore||0})" class="text-blue-500 hover:underline text-xs font-bold">✏️ 更新成绩/设定</button>
                        ${s.CustomRewardStatus === "饮料未兑换" ? `<button onclick="claimDrink(${s.rowNumber}, '${s.Name}')" class="ml-2 bg-amber-500 text-white px-2 py-0.5 rounded text-xs font-bold animate-pulse">确认发饮料</button>` : ''}
                    </td>

                    <td class="p-3">
                        <button onclick="manualCheckIn(${s.rowNumber}, '${s.Name}')" class="bg-gray-800 text-white px-3 py-1.5 rounded text-xs font-bold">📅 补签打卡</button>
                    </td>

                    <td class="p-3 text-right">
                        <button onclick="deleteS(${s.rowNumber}, '${s.Name}')" class="text-red-500 font-bold hover:underline">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 极简直接弹窗输入成绩
        async function editScores(row, name, last, curr, target) {
            const lastS = prompt(`【${name}】请输入 上期分数:`, last); if(lastS === null) return;
            const currS = prompt(`【${name}】请输入 本期分数:`, curr); if(currS === null) return;
            const targetS = prompt(`【${name}】设定饮料目标分 (不设定填0):`, target); if(targetS === null) return;

            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateScores", rowNumber: row, lastScore: parseInt(lastS)||0, currentScore: parseInt(currS)||0, customTarget: parseInt(targetS)||0 }) });
            loadStudents();
        }

        async function manualCheckIn(row, name) {
            const date = prompt(`为【${name}】记录出席。请确认日期:`, new Date().toISOString().split('T')[0]);
            if(!date) return;
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateAttendance", rowNumber: row, date: date.trim() }) });
            loadStudents();
        }

        async function claimDrink(row, name) {
            if(confirm(`确定已将饮料发给【${name}】了吗？`)) {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "claimDrink", rowNumber: row }) });
                loadStudents();
            }
        }

        async function adjust(row, amt) { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "adjustLessons", rowNumber: row, amount: amt }) }); loadStudents(); }
        async function deleteS(row, name) { if(confirm(`⚠️ 确定要彻底删除学生 ${name} 吗？`)) { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "deleteStudent", rowNumber: row }) }); loadStudents(); } }
        async function addStudent(e) { e.preventDefault(); await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "addStudent", name: document.getElementById("newName").value, phone: document.getElementById("newPhone").value, price: document.getElementById("newPrice").value }) }); document.getElementById("addStudentForm").reset(); loadStudents(); }

        function toggleScanner() {
            const container = document.getElementById("scannerContainer");
            if (container.classList.contains("hidden")) {
                container.classList.remove("hidden");
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                html5QrcodeScanner.render(async (txt) => {
                    html5QrcodeScanner.clear(); document.getElementById("scannerContainer").classList.add("hidden");
                    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateAttendance", studentId: txt, date: new Date().toISOString().split('T')[0] }) });
                    const data = await res.json(); alert(`叮！打卡成功：${data.name}`); loadStudents();
                });
            } else { container.classList.add("hidden"); if(html5QrcodeScanner) html5QrcodeScanner.clear(); }
        }
        window.onload = loadStudents;
    </script>
</body>
</html>

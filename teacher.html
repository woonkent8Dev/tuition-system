<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课室管理系统 - 教师端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow space-y-6">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🎒 课室管理系统 - 教师后台</h1>
                <p class="text-sm text-gray-500 mt-1">支持智能补签、资料修改、删除学生及 QR 码扫描打卡</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="toggleScanner()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg shadow font-medium transition flex items-center gap-1">
                    📷 扫描 QR 码打卡
                </button>
                <button onclick="remindAllDebts()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow font-medium transition">
                    🚨 一键催缴 (所有欠费)
                </button>
            </div>
        </div>

        <div id="scannerContainer" class="hidden bg-gray-50 p-4 rounded-xl border-2 border-dashed border-purple-300 max-w-md mx-auto text-center">
            <h3 class="text-sm font-bold text-purple-800 mb-2">请让学生展示专属 QR 码对准摄像头</h3>
            <div id="reader" class="w-full bg-white rounded-lg overflow-hidden"></div>
            <button onclick="toggleScanner()" class="mt-3 text-sm text-gray-500 hover:underline">关闭扫描枪</button>
        </div>

        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
            <h3 class="text-sm font-bold text-blue-800 mb-3">➕ 快速添加新学生</h3>
            <form id="addStudentForm" onsubmit="addStudent(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input type="text" id="newName" placeholder="学生姓名" required class="px-3 py-2 bg-white border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <input type="text" id="newPhone" placeholder="手机号 (例: 60123456789)" required class="px-3 py-2 bg-white border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <div class="relative">
                    <span class="absolute left-3 top-2 text-gray-500 text-sm">RM</span>
                    <input type="number" id="newPrice" placeholder="每堂价格" value="37.5" step="0.1" required class="w-full pl-10 pr-3 py-2 bg-white border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">保存并同步</button>
            </form>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-sm">
                        <th class="p-3">ID</th>
                        <th class="p-3">姓名</th>
                        <th class="p-3">手机号码 / 每堂单价</th>
                        <th class="p-3">剩余堂数</th>
                        <th class="p-3">估算余额</th>
                        <th class="p-3">出勤记录</th>
                        <th class="p-3">手动调整堂数</th>
                        <th class="p-3">管理操作</th>
                    </tr>
                </thead>
                <tbody id="studentTable" class="divide-y divide-gray-200 text-sm">
                    <tr><td colspan="8" class="p-4 text-center text-gray-500">数据加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 🔴 记得在这里填入你的 Google Apps Script Web App URL
        const API_URL = "https://script.google.com/macros/s/AKfycbzbalput2v0mcOrIZSrO6upum_A6dUvy43aqluFrgqV6jItTUPnOPotUGyHpGmKlZy4/exec"; 
        let studentsData = [];
        let html5QrcodeScanner = null;

        async function loadStudents() {
            try {
                const response = await fetch(API_URL);
                studentsData = await response.json();
                renderTable();
            } catch (error) {
                alert("加载数据失败，请检查网络或API设置。");
            }
        }

        function renderTable() {
            const tbody = document.getElementById("studentTable");
            tbody.innerHTML = "";

            if(studentsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-400">暂无学员。</td></tr>`;
                return;
            }

            studentsData.forEach(student => {
                const price = parseFloat(student.PricePerLesson) || 37.5;
                const balance = student.RemainingLessons * price;
                const isDebt = student.RemainingLessons <= 0;

                const tr = document.createElement("tr");
                tr.className = isDebt ? "bg-red-50/60 hover:bg-red-100/50" : "hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="p-3 text-gray-400 font-mono">#${student.ID}</td>
                    <td class="p-3 font-semibold text-gray-800">${student.Name}</td>
                    <td class="p-3">
                        <div class="text-gray-700 font-medium">${student.Phone}</div>
                        <div class="text-xs text-gray-400">单价: RM ${price.toFixed(2)}</div>
                    </td>
                    <td class="p-3 font-bold ${isDebt ? 'text-red-600' : 'text-green-600'}">${student.RemainingLessons} 堂</td>
                    <td class="p-3 font-medium ${isDebt ? 'text-red-600' : 'text-green-600'}">RM ${balance.toFixed(2)}</td>
                    <td class="p-3">
                        <button onclick="checkInPrompt(${student.rowNumber}, '${student.Name}')" class="bg-blue-600 text-white px-2.5 py-1.5 rounded hover:bg-blue-700 text-xs font-bold shadow-sm flex items-center gap-1">
                            📅 补录/手动打卡
                        </button>
                    </td>
                    <td class="p-3">
                        <div class="flex space-x-1">
                            <button onclick="adjustLessons(${student.rowNumber}, 1)" class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold hover:bg-green-200">+1</button>
                            <button onclick="adjustLessons(${student.rowNumber}, 4)" class="bg-green-600 text-white px-2 py-1 rounded text-xs font-bold hover:bg-green-700">+4堂</button>
                            <button onclick="adjustLessons(${student.rowNumber}, -1)" class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs font-bold hover:bg-gray-300">-1</button>
                        </div>
                    </td>
                    <td class="p-3 space-x-2">
                        <button onclick="editStudentPrompt(${student.rowNumber}, '${student.Phone}', ${price})" class="text-blue-600 hover:underline text-xs">修改</button>
                        <button onclick="deleteStudent(${student.rowNumber}, '${student.Name}')" class="text-red-500 hover:underline text-xs">删除</button>
                        <button onclick="sendWhatsApp('${student.Phone}', 'remind', '${student.Name}', ${student.RemainingLessons}, ${price})" class="text-orange-600 hover:underline text-xs font-bold">催缴</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function addStudent(event) {
            event.preventDefault();
            const name = document.getElementById("newName").value.trim();
            const phone = document.getElementById("newPhone").value.trim();
            const price = document.getElementById("newPrice").value;

            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addStudent", name, phone, price: parseFloat(price) })
            });
            if(res.ok) { 
                document.getElementById("addStudentForm").reset();
                document.getElementById("newPrice").value = "37.5";
                loadStudents(); 
            }
        }

        // 🆕 升级版手动打卡：支持自由选择日期（事后补录核心）
        async function checkInPrompt(rowNumber, name) {
            const today = new Date().toISOString().split('T')[0];
            
            // 弹窗要求输入日期，默认带入今天日期
            const selectedDate = prompt(`请输入要为 [${name}] 记录出席的日期 (格式: YYYY-MM-DD):`, today);
            
            // 如果用户点击了取消，或者什么都没输，则终止操作
            if (selectedDate === null || selectedDate.trim() === "") return;

            // 验证日期格式
            const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
            if (!dateRegex.test(selectedDate.trim())) {
                alert("❌ 日期格式不正确，请输入类似 2026-06-02 的格式！");
                return;
            }

            if(!confirm(`确定为 ${name} 记录 [${selectedDate}] 的出勤，并扣除1堂课吗？`)) return;

            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "updateAttendance", rowNumber, date: selectedDate.trim() })
            });
            if(res.ok) { 
                alert(`🎉 成功补录！[${name}] 在 ${selectedDate} 的出勤已记入。`); 
                loadStudents(); 
            }
        }

        async function adjustLessons(rowNumber, amount) {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "adjustLessons", rowNumber, amount }) });
            if(res.ok) loadStudents();
        }

        async function editStudentPrompt(rowNumber, oldPhone, oldPrice) {
            const newPhone = prompt("请输入新的手机号码:", oldPhone);
            if (newPhone === null) return;
            const newPrice = prompt("请输入新的每堂课价格 (RM):", oldPrice);
            if (newPrice === null) return;

            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "editStudent", rowNumber, phone: newPhone.trim(), price: parseFloat(newPrice) })
            });
            if(res.ok) { alert("修改成功！"); loadStudents(); }
        }

        async function deleteStudent(rowNumber, name) {
            if(!confirm(`⚠️ 严重警告：你确定要彻底删除学生 [${name}] 吗？删除后其所有记录将消失且不可恢复！`)) return;
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "deleteStudent", rowNumber }) });
            if(res.ok) { alert("学生已安全移除。"); loadStudents(); }
        }

        // 相机扫码控制
        function toggleScanner() {
            const container = document.getElementById("scannerContainer");
            if (container.classList.contains("hidden")) {
                container.classList.remove("hidden");
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                html5QrcodeScanner.render(onScanSuccess);
            } else {
                container.classList.add("hidden");
                if(html5QrcodeScanner) html5QrcodeScanner.clear();
            }
        }

        async function onScanSuccess(decodedText) {
            if(html5QrcodeScanner) html5QrcodeScanner.clear();
            document.getElementById("scannerContainer").classList.add("hidden");

            const today = new Date().toISOString().split('T')[0];
            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "updateAttendance", studentId: decodedText, date: today })
            });
            const data = await res.json();
            if(data.status === "success") {
                alert(`🎉 QR码扫码成功！学员: ${data.name} 已自动扣除1课时并记入今日。`);
                loadStudents();
            } else {
                alert("❌ 打卡失败: " + (data.message || "无效的二维码"));
            }
        }

        function sendWhatsApp(phone, type, name, lessons, pricePerLesson) {
            const price = pricePerLesson || 37.5;
            const totalCost = (price * 4).toFixed(2);
            let message = "";
            if (type === 'absent') {
                message = `您好，特此通知：${name} 同学今天未出席课堂。如有请假请提前告知，谢谢。`;
            } else if (type === 'remind') {
                const absLessons = Math.abs(lessons);
                message = `您好，提醒您：${name} 同学的学费已到期（目前欠缴 ${absLessons} 堂课 / 或新学期需要续费），4堂课学费为 RM ${totalCost}，请尽快安排缴费，谢谢您的支持！`;
            }
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function remindAllDebts() {
            const debtStudents = studentsData.filter(s => s.RemainingLessons <= 0);
            if(debtStudents.length === 0) { alert("目前没有欠费的同学！"); return; }
            if(confirm(`确定依次向这 ${debtStudents.length} 位同学发送催缴提示吗？`)) {
                debtStudents.forEach((student, idx) => {
                    setTimeout(() => { sendWhatsApp(student.Phone, 'remind', student.Name, student.RemainingLessons, student.PricePerLesson); }, idx * 1500);
                });
            }
        }

        window.onload = loadStudents;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学员服务中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center p-4">
    <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-md space-y-5 my-2 border">
        
        <div class="text-center">
            <h2 class="text-xl font-bold text-gray-800">🏫 学员服务中心</h2>
            <p class="text-xs text-gray-500 mt-1">查询剩余课堂与成绩记录</p>
        </div>
        
        <div class="space-y-3">
            <input type="text" id="phone" placeholder="请输入绑定的手机号" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            <button onclick="query()" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg">🔍 立即查询</button>
        </div>

        <div id="resArea" class="hidden border-t pt-4 space-y-4">
            
            <div id="qrcode" class="p-2 bg-white rounded shadow-sm mx-auto w-fit border border-gray-200"></div>
            
            <div class="bg-gray-50 p-3 rounded-lg border flex justify-between items-center">
                <div>
                    <span class="text-xs text-gray-500 block">姓名：<b id="resName" class="text-gray-800 text-sm"></b></span>
                    <span class="text-xs text-gray-500 block mt-1">剩余：<b id="resL" class="text-lg text-blue-600"></b> 堂</span>
                </div>
                <div id="debtAlert" class="text-xs font-bold text-red-600 bg-red-100 px-2 py-1 rounded hidden">需尽快缴费</div>
            </div>

            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                <span class="text-xs font-bold text-gray-700 block mb-2">📊 学术与奖励记录</span>
                <div class="text-sm text-gray-600 mb-1">上期分数：<b id="resLast"></b> | 本期分数：<b id="resCurr" class="text-blue-600"></b></div>
                <div id="drinkStatus" class="text-xs font-bold text-orange-600"></div>
            </div>

            <button onclick="togglePay()" class="w-full bg-gray-800 text-white text-xs py-2 rounded-lg font-bold mt-2">💳 展开学费付款码</button>
            <div id="payBox" class="hidden grid grid-cols-2 gap-2 p-3 bg-gray-100 rounded-lg">
                <div class="bg-white p-2 rounded text-center">
                    <span class="font-bold text-blue-600 text-[10px]">Touch 'n Go</span>
                    <img src="tngo.JPG" class="w-full h-auto mx-auto border mt-1" alt="TnG">
                </div>
                <div class="bg-white p-2 rounded text-center">
                    <span class="font-bold text-red-600 text-[10px]">Bank Transfer</span>
                    <img src="bank.jpg" class="w-full h-auto mx-auto border mt-1" alt="Bank">
                </div>
            </div>

        </div>
    </div>

    <script>
        // 🔴 填入你的 Google Apps Script 网址
        const API_URL = "https://script.google.com/macros/s/AKfycbxqvJFuhJ-15UqiIFPgjup1JYqDBjXNr__f_AOKninXVjAP8t8vpyE0yWHd3guK-vtw/exec"; 
        
        async function query() {
            const resArea = document.getElementById("resArea");
            const phone = document.getElementById("phone").value.trim();
            const qr = document.getElementById("qrcode");
            
            if(!phone) { alert("手机号不能为空"); return; }
            qr.innerHTML = ""; resArea.classList.add("hidden");

            try {
                const response = await fetch(API_URL);
                const students = await response.json();
                
                // 防护机制：如果读取到的不是数组，说明后台出错了
                if(!Array.isArray(students)) {
                    alert("后台数据格式错误！请确认你的 Google Script 已成功发布为 New Version！");
                    return;
                }

                const s = students.find(x => String(x.Phone).trim() === phone);

                if(s) {
                    document.getElementById("resName").innerText = s.Name;
                    document.getElementById("resL").innerText = s.RemainingLessons;
                    
                    if(s.RemainingLessons <= 0) {
                        document.getElementById("debtAlert").classList.remove("hidden");
                    } else {
                        document.getElementById("debtAlert").classList.add("hidden");
                    }

                    document.getElementById("resLast").innerText = s.LastScore || 0;
                    document.getElementById("resCurr").innerText = s.CurrentScore || 0;
                    
                    if(s.CustomTargetScore > 0) {
                        let txt = `目标分: ${s.CustomTargetScore}。`;
                        if(s.CustomRewardStatus === "饮料未兑换") txt += "🎉 达成！请向老师领取饮料";
                        else if(s.CustomRewardStatus === "饮料已兑换") txt += "✅ 饮料已领";
                        else txt += "加油冲刺！";
                        document.getElementById("drinkStatus").innerText = txt;
                    } else {
                        document.getElementById("drinkStatus").innerText = "";
                    }

                    new QRCode(qr, { text: String(s.ID), width: 130, height: 130 });
                    resArea.classList.remove("hidden");
                } else { 
                    alert("查无此人，请确认手机号是否输入正确。"); 
                }
            } catch (e) { 
                alert("网络异常或链接未填对，请稍后再试。"); 
                console.error(e);
            }
        }
        function togglePay() { document.getElementById("payBox").classList.toggle("hidden"); }
    </script>
</body>
</html>

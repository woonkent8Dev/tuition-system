<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生中心 - 出勤与学费查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-center items-center p-4">
    <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-md border border-gray-100 space-y-6">
        <div class="text-center">
            <h2 class="text-xl font-bold text-gray-800">🏫 学员服务中心</h2>
            <p class="text-xs text-gray-500 mt-1">输入登记的手机号码查询出勤与获取专属打卡QR码</p>
        </div>
        
        <div class="space-y-3">
            <input type="text" id="searchPhone" placeholder="请输入手机号 (例: 60123456789)" class="w-full px-4 py-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <button onclick="queryStudent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg shadow transition text-sm">
                🔍 立即查询
            </button>
        </div>

        <div id="resultArea" class="hidden border-t pt-4 space-y-5">
            
            <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 flex flex-col items-center text-center">
                <span class="text-xs font-bold text-purple-700 mb-2">🎟️ 您的专属课堂电子打卡码</span>
                <div id="qrcode" class="p-2 bg-white rounded-lg shadow-sm"></div>
                <p class="text-[11px] text-purple-400 mt-2">上课时请向老师展示此码，即可快速扫码完成签到</p>
            </div>

            <div class="flex justify-between items-center px-1">
                <span class="text-gray-500 text-sm">学生姓名</span>
                <span id="resName" class="font-bold text-gray-800 text-lg">-</span>
            </div>
            
            <div id="statusCard" class="p-4 rounded-lg flex justify-between items-center">
                <div>
                    <span class="text-xs text-gray-500 block">Remaining Lessons</span>
                    <span id="resLessons" class="text-2xl font-black">-</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-gray-500 block">学费状态</span>
                    <span id="resStatus" class="text-sm font-bold">-</span>
                </div>
            </div>

            <div id="debtAlert" class="bg-red-100 text-red-700 p-3 rounded-lg text-xs hidden font-medium leading-relaxed">
                ⚠️ 提示：您的课时已用完或处于拖欠状态，为免影响上课，请联系老师安排缴费（RM <span id="dynamicPrice">150.00</span> / 4堂）。
            </div>

            <div>
                <span class="text-xs font-bold text-gray-500 block mb-2">📅 已出席历史日期（最新置顶）：</span>
                <div id="resDates" class="flex flex-col gap-2"></div>
            </div>
        </div>

        <div id="errorMsg" class="text-center text-sm text-red-500 font-medium hidden">
            ❌ 未找到该手机号对应的学员信息，请联系老师。
        </div>
    </div>

    <script>
        // 🔴 记得在这里填入你的 Google Apps Script Web App URL
        const API_URL = "https://script.google.com/macros/s/AKfycbzbalput2v0mcOrIZSrO6upum_A6dUvy43aqluFrgqV6jItTUPnOPotUGyHpGmKlZy4/exec"; 

        async function queryStudent() {
            const inputPhone = document.getElementById("searchPhone").value.trim();
            const resultArea = document.getElementById("resultArea");
            const errorMsg = document.getElementById("errorMsg");
            const debtAlert = document.getElementById("debtAlert");
            const qrDiv = document.getElementById("qrcode");

            if(!inputPhone) { alert("请输入手机号"); return; }

            resultArea.classList.add("hidden");
            errorMsg.classList.add("hidden");
            debtAlert.classList.add("hidden");
            qrDiv.innerHTML = ""; 

            try {
                const response = await fetch(API_URL);
                const students = await response.json();
                const student = students.find(s => String(s.Phone).trim() === inputPhone);

                if(student) {
                    document.getElementById("resName").innerText = student.Name;
                    document.getElementById("resLessons").innerText = `${student.RemainingLessons} 堂`;
                    
                    const singlePrice = parseFloat(student.PricePerLesson) || 37.5;
                    document.getElementById("dynamicPrice").innerText = (singlePrice * 4).toFixed(2);

                    const isDebt = student.RemainingLessons <= 0;
                    const statusCard = document.getElementById("statusCard");
                    
                    if(isDebt) {
                        statusCard.className = "p-4 rounded-lg bg-red-50 flex justify-between items-center border border-red-200";
                        document.getElementById("resLessons").className = "text-2xl font-black text-red-600";
                        document.getElementById("resStatus").innerText = "需尽快缴费";
                        document.getElementById("resStatus").className = "text-sm font-bold text-red-600";
                        debtAlert.classList.remove("hidden");
                    } else {
                        statusCard.className = "p-4 rounded-lg bg-green-50 flex justify-between items-center border border-green-200";
                        document.getElementById("resLessons").className = "text-2xl font-black text-green-600";
                        document.getElementById("resStatus").innerText = "正常";
                        document.getElementById("resStatus").className = "text-sm font-bold text-green-600";
                    }

                    // 生成专属于学生 ID 的二维码
                    new QRCode(qrDiv, {
                        text: String(student.ID),
                        width: 140,
                        height: 140,
                        colorDark : "#5b21b6", 
                        colorLight : "#ffffff"
                    });

                    // 🆕 高级日期反向渲染逻辑
                    const datesDiv = document.getElementById("resDates");
                    datesDiv.innerHTML = "";
                    
                    if(student.AttendanceDates) {
                        // 切割并过滤空字符串
                        const datesArray = student.AttendanceDates.split(",").map(d => d.trim()).filter(Boolean);
                        
                        // 🌟 核心：执行反转，最新日期置顶
                        datesArray.reverse(); 

                        datesArray.forEach((date, index) => {
                            const dateRow = document.createElement("div");
                            
                            if (index === 0) {
                                // 最新打卡的那天：高亮深蓝色，带NEW徽章
                                dateRow.className = "flex justify-between items-center bg-blue-600 text-white text-xs px-3 py-2 rounded-lg shadow-sm font-mono font-bold";
                                dateRow.innerHTML = `<span>${date}</span><span class="bg-blue-800 text-[10px] uppercase px-1.5 py-0.5 rounded text-white tracking-wider">最新出席</span>`;
                            } else {
                                // 历史老数据：淡灰色，不抢眼
                                dateRow.className = "flex justify-between items-center bg-gray-100 text-gray-600 text-xs px-3 py-1.5 rounded-md font-mono border border-gray-200";
                                dateRow.innerHTML = `<span>${date}</span><span class="text-gray-400 text-[10px]">历史记录</span>`;
                            }
                            datesDiv.appendChild(dateRow);
                        });
                    } else {
                        datesDiv.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-2">暂无出席记录</p>`;
                    }

                    resultArea.classList.remove("hidden");
                } else {
                    errorMsg.classList.remove("hidden");
                }
            } catch (error) {
                alert("网络请求失败，请稍后重试。");
            }
        }
    </script>
</body>
</html>
